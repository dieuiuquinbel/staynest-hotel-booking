services:
  mysql:
    image: mysql:8.0
    container_name: staynest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: hotel_booking_db
    ports:
      - "3308:3306"
    volumes:
      - staynest_mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: staynest-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hotel_booking_db
      DB_USER: root
      DB_PASSWORD: 123456
      JWT_SECRET: staynest_jwt_docker_secret_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: staynest-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  staynest_mysql_data:
